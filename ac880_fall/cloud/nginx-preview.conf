# Private development endpoint. Public HTTPS is configured only after the domain
# and ICP access requirements are ready. Do not change this to 0.0.0.0.
user www-data;
worker_processes 1;
pid /run/ac880-home-preview.pid;
error_log /opt/ac880-home-preview/logs/error.log warn;

events { worker_connections 256; }

http {
    server_tokens off;
    access_log /opt/ac880-home-preview/logs/access.log;
    client_max_body_size 4k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 20s;

    server {
        listen 127.0.0.1:18089;
        server_name _;
        auth_basic "AC880 Home Preview";
        auth_basic_user_file /opt/ac880-home-preview/users.htpasswd;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;

        location / {
            proxy_pass http://127.0.0.1:18088;
            # Keep the browser's host, including a preview port, for CSRF checks.
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization "";
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_max_temp_file_size 0;
            proxy_connect_timeout 5s;
            proxy_read_timeout 75s;
            proxy_send_timeout 20s;
        }
    }
}
